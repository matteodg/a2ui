name: Java SDK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "java/**"
      - "samples/client/swing/**"
      - "conformance/**"
      - "specification/**"
      - "catalogs/**"
      - ".github/workflows/java_build_and_test.yml"
  pull_request:
    branches: [main]
    paths:
      - "java/**"
      - "samples/client/swing/**"
      - "conformance/**"
      - "specification/**"
      - "catalogs/**"
      - ".github/workflows/java_build_and_test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      # The `verify` phase compiles the code, runs the tests and does the format check.
      - name: Build and test
        working-directory: java
        env:
          A2UI_CONFORMANCE_MANIFEST_DIR: ${{ runner.temp }}/a2ui-manifest
        run: ./mvnw -B verify

      - name: Set up Python
        uses: ./.github/actions/setup-python

      # Each module writes the manifest of its harness to the same directory.
      - name: Check executed conformance cases of the core
        run: |
          uv run --project conformance python conformance/scripts/check_executed_cases.py \
            --manifest-dir "${{ runner.temp }}/a2ui-manifest" \
            --harness java-core \
            --corpus core

      - name: Check executed conformance cases of the Swing adapter
        run: |
          uv run --project conformance python conformance/scripts/check_executed_cases.py \
            --manifest-dir "${{ runner.temp }}/a2ui-manifest" \
            --harness swing \
            --corpus adapter
